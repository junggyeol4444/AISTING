name: AISTING stage-one real-local EXE (not a broadcast pass)
on:
  push:
    branches:
      - test/v105-windows-validation-20261015
    paths:
      - src/ai_broadcaster/stage1_live.py
      - scripts/run_stage1.py
      - scripts/stage1_windows_screen.py
      - .github/workflows/stage1-live-windows.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage1-native:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Source syntax only (not real hardware or model evidence)
        run: python -m compileall -q src/ai_broadcaster scripts/run_stage1.py scripts/stage1_windows_screen.py
      - name: Prepare Windows packaging and screenshot tools on disposable CI runner
        run: python -m pip install --disable-pip-version-check "pyinstaller>=6,<7" "pyautogui>=0.9.54,<1"
      - name: Build new independent native executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name AISTING-STAGE1-REAL-LOCAL --paths src scripts/run_stage1.py
      - name: Real GUI screen (no fake AI, no sound, no OBS)
        shell: pwsh
        timeout-minutes: 4
        run: |
          $exe = (Resolve-Path "dist/AISTING-STAGE1-REAL-LOCAL.exe").Path
          Start-Process -FilePath $exe | Out-Null
          try {
            python scripts/stage1_windows_screen.py
          } finally {
            Get-Process -Name "AISTING-STAGE1-REAL-LOCAL" -ErrorAction SilentlyContinue |
              Stop-Process -Force -ErrorAction SilentlyContinue
          }
      - name: Upload actual native executable and unedited screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AISTING-stage1-Windows-REAL-LOCAL-not-validated
          path: |
            dist/AISTING-STAGE1-REAL-LOCAL.exe
            stage1_windows_evidence/actual_stage1_window.png
          if-no-files-found: warn
          retention-days: 14
