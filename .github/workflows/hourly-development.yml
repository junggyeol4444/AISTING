name: AISTING hourly development checks

on:
  schedule:
    - cron: '30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: hourly-aisting-development
  cancel-in-progress: false

jobs:
  validate-and-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate project
        run: |
          python tools.py validate
          python -m unittest discover -s tests -v
      - name: Write development summary
        run: python scripts/hourly_status.py >> "$GITHUB_STEP_SUMMARY"
      - name: Ensure next development issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/hourly_issue.py
