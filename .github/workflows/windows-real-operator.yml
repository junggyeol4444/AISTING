name: Windows real EXE operator interaction (screenshots)
on:
  push:
    branches:
      - test/v105-windows-validation-20261015
    paths:
      - scripts/windows_exe_real_operator.py
      - .github/workflows/windows-real-operator.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  windows-real-ui:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download actual frozen EXE from verified Windows test-branch run
        uses: actions/download-artifact@v4
        with:
          name: AISTING-v105-Windows-EXE-TEST-BRANCH
          run-id: 38665856725
          github-token: ${{ github.token }}
      - name: Install screenshot and input automation (test runner only)
        run: python -m pip install --disable-pip-version-check "pyautogui>=0.9.54,<1"
      - name: Capture operator interactions from real Windows EXE
        run: python scripts/windows_exe_real_operator.py
      - name: Upload actual screen evidence and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AISTING-Windows-REAL-operator-screen-evidence
          path: |
            operator_e2e_evidence/
          if-no-files-found: warn
          retention-days: 14
