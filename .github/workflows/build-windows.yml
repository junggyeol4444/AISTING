name: AISTING existing Windows EXE build

# Build the already integrated original application, never the obsolete
# scripts/desktop_app.py entrypoint. No push, merge or installation on user PC.
on:
  workflow_dispatch:
  push:
    branches:
      - dev/aisting-local-source-v26-20261016

permissions:
  contents: read

concurrency:
  group: aisting-existing-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      PYTHONPATH: src
      AISTING_PYTHON: python
    steps:
      - name: Checkout complete existing AISTING source
        uses: actions/checkout@v4

      - name: Set up Windows Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64

      - name: Install free build dependencies on disposable Windows runner
        shell: pwsh
        run: |
          python -m pip install "pyinstaller>=6,<7" "pywebview>=5,<7" "obsws-python==1.8.0" "websocket-client==1.9.0"
          python -c "import tkinter, PyInstaller, webview, obsws_python, websocket; print('Windows build dependencies present')"

      - name: Validate original 100-step specification and project
        shell: pwsh
        run: |
          python tools.py validate

      - name: Verify integrated native Windows entrypoint and viewer
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_aisting*.py" -v

      - name: Audit full original regression suite (track known legacy incompatibilities)
        id: inherited
        shell: pwsh
        continue-on-error: true
        run: |
          python -m unittest discover -s tests -v

      - name: Build real native Windows executable and run its self-test
        shell: cmd
        run: call build_exe_windows.bat

      - name: Verify one nonempty bundled executable
        shell: pwsh
        run: |
          $executables = @(Get-ChildItem -Path . -Recurse -File -Filter AISTING.exe |
            Where-Object { $_.Directory.Name -like 'dist-native-*' })
          if ($executables.Count -ne 1) { throw "Expected exactly one built AISTING.exe; found $($executables.Count)" }
          if ($executables[0].Length -lt 1000000) { throw "AISTING.exe unexpectedly small" }
          Write-Host "Windows AISTING.exe built: $($executables[0].FullName) ($($executables[0].Length) bytes)"

      - name: Construct original Windows Tk GUI inside isolated CI and close it
        shell: pwsh
        timeout-minutes: 4
        env:
          AISTING_GUI_SELFTEST: approved_ci_only
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'AISTING-EXE-GUI-TEST'
          New-Item -ItemType Directory -Path $env:LOCALAPPDATA -Force | Out-Null
          $exe = @(Get-ChildItem -Path . -Recurse -File -Filter AISTING.exe |
            Where-Object { $_.Directory.Name -like 'dist-native-*' })
          if ($exe.Count -ne 1) { throw 'No unique Windows native executable to test' }
          $process = Start-Process -FilePath $exe[0].FullName -ArgumentList '--aisting-gui-selftest' -PassThru
          try {
            if (-not $process.WaitForExit(90000)) {
              throw 'Original AISTING Windows Tk GUI did not exit within 90 seconds'
            }
            $process.Refresh()
            if ($process.ExitCode -ne 0) {
              throw "Original AISTING Windows Tk GUI startup failed (exit $($process.ExitCode))"
            }
            Write-Host 'Original AISTING Tk GUI created and destroyed successfully in isolated CI'
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Upload real Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: AISTING-Windows-EXE-integrated
          path: dist-native-*/AISTING.exe
          if-no-files-found: error
          retention-days: 30

      - name: Report unresolved original regression failures as CI failure
        if: steps.inherited.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Error "Full inherited regression suite has failures. EXE artifact is a build candidate, not a fully validated program."
          exit 1


  # Real OBS Studio, not a mocked obsws response. Runs in a disposable Windows VM.
  # Does not connect to the user's device, access accounts, start recording or stream.
  obs-real-readonly:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: src
      PYTHONUTF8: '1'
    steps:
      - name: Checkout same existing AISTING development source
        uses: actions/checkout@v4

      - name: Set up Windows Python and actual OBS websocket client
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install original official OBS Studio only on disposable CI VM
        shell: pwsh
        run: |
          choco install obs-studio --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { throw 'OBS Studio installation failed on the temporary CI machine' }

      - name: Connect to running official OBS v5 and read actual scene / frame
        shell: pwsh
        timeout-minutes: 5
        run: |
          python -m pip install "obsws-python==1.8.0"
          if ($LASTEXITCODE -ne 0) { throw 'Existing OBS SDK installation failed' }
          $obs = Join-Path $env:ProgramFiles 'obs-studio\bin\64bit\obs64.exe'
          if (-not (Test-Path $obs)) { throw "Official OBS binary not found at $obs" }
          $env:AISTING_CI_OBS_PASSWORD = [guid]::NewGuid().ToString('N')
          # A fresh OBS user profile has its WebSocket server DISABLED by
          # default. OBS v5 stores this in plugin_config/obs-websocket/config.json.
          # Enable ONLY the isolated CI profile; CLI supplies a throwaway password.
          $confDir = Join-Path $env:APPDATA 'obs-studio\plugin_config\obs-websocket'
          New-Item -ItemType Directory -Path $confDir -Force | Out-Null
          $conf = '{"FirstLoad":false,"ServerEnabled":true,"AuthRequired":true,"ServerPort":4455}'
          Set-Content -Path (Join-Path $confDir 'config.json') -Value $conf -Encoding utf8
          # The official OBS first-run wizard can block completion of module
          # initialization on unattended Windows CI. Only this throwaway
          # runner profile is marked as initialized; no real profile touched.
          $obsUser = Join-Path $env:APPDATA 'obs-studio'
          # Retain OBS-generated user.ini; only seed disposable global.ini and plugin configuration.
          # Also support upstream's global.ini -> plugin JSON migration path.
          @('[General]', 'LastVersion=320202', '[OBSWebSocket]',
            'FirstLoad=false', 'ServerEnabled=true', 'AuthRequired=true',
            'ServerPort=4455') | Set-Content (Join-Path $obsUser 'global.ini') -Encoding ascii
          Write-Host 'Configured real OBS websocket and first-run state in isolated Windows CI profile'

          $runner = Start-Process -FilePath $obs -WorkingDirectory (Split-Path $obs -Parent) -ArgumentList @(
            '--disable-updater', '--disable-shutdown-check', '--websocket_ipv4_only',
            '--websocket_port=4455', "--websocket_password=$env:AISTING_CI_OBS_PASSWORD"
          ) -PassThru
          try {
            $probe = Join-Path $env:RUNNER_TEMP 'aisting_real_obs_probe.py'
            @'
          import os
          import time
          from ai_broadcaster.original_plan_obs import OfficialObsWebsocket
          password = os.environ["AISTING_CI_OBS_PASSWORD"]
          deadline = time.monotonic() + 90
          last_error = None
          while time.monotonic() < deadline:
              try:
                  client = OfficialObsWebsocket(password, port=4455)
                  state = client.connect()
                  break
              except Exception as error:
                  last_error = error
                  time.sleep(2)
          else:
              raise AssertionError("Official OBS WebSocket 5 did not start") from last_error
          print("REAL_OBS_CONNECTED:", state.version, state.scene, "streaming:", state.streaming)
          assert not state.streaming, "AISTING must never broadcast during CI"
          inventory = client.read_scene_inventory()
          print("REAL_OBS_SCENE_ITEMS:", inventory.scene_items)
          print("REAL_OBS_INPUTS:", inventory.input_names)
          frame = client.read_current_scene_frame(operator_approved=True)
          print("REAL_OBS_RENDERED_PNG:", frame.width, frame.height, len(frame.png_data))
          assert frame.png_data.startswith(b'\x89PNG\r\n\x1a\n')
          # Actual OBS rendered-video verification. Create a temporary
          # source ONLY in the CI runner's fresh default scene. Read both
          # frames through AISTING's existing real OBS PNG decoder.
          import hashlib
          import obsws_python
          active = obsws_python.ReqClient(host="127.0.0.1", port=4455,
                                          password=password, timeout=5)
          available = active.get_input_kind_list(False).input_kinds
          assert "color_source_v3" in available, "Official OBS color input unavailable"
          ci_input = "AISTING CI color input"
          active.create_input(state.scene, ci_input, "color_source_v3",
                              {"color": 0xFF0000FF, "width": 640, "height": 360}, True)
          assert ci_input in client.read_scene_inventory().input_names
          time.sleep(1)
          before = client.read_current_scene_frame(operator_approved=True)
          active.set_input_settings(ci_input, {"color": 0xFF00FF00}, True)
          time.sleep(1)
          after = client.read_current_scene_frame(operator_approved=True)
          assert before.width == after.width == 640
          assert before.height == after.height == 360
          assert before.png_data != after.png_data, (
              "Real OBS source changed but OBS-rendered pixels did not"
          )
          print("REAL_OBS_LIVE_VIDEO_CHANGE:",
                hashlib.sha256(before.png_data).hexdigest()[:16],
                hashlib.sha256(after.png_data).hexdigest()[:16])
          # Drive the REAL official OBS audio engine with a generated local
          # WAV calibration tone in this disposable CI VM. This does NOT use
          # a person's voice, microphone, API or synthetic fake OBS client.
          # It is evidence of OBS playback/meter/routing, not GPT-SoVITS speech.
          import math
          import struct
          import wave
          from pathlib import Path
          wav_path = Path(os.environ["RUNNER_TEMP"]) / "aisting_ci_obs_audio_440hz.wav"
          with wave.open(str(wav_path), "wb") as writer:
              writer.setnchannels(1)
              writer.setsampwidth(2)
              writer.setframerate(48000)
              for segment in range(7):
                  frames = [int(12000 * math.sin(2 * math.pi * 440 * (segment*48000 + j) / 48000))
                            for j in range(48000)]
                  writer.writeframesraw(struct.pack("<48000h", *frames))
          wav_name = "AISTING CI WAV audio input"
          kinds = active.get_input_kind_list(False).input_kinds
          assert "ffmpeg_source" in kinds, "Official OBS FFmpeg media input missing"
          active.create_input(state.scene, wav_name, "ffmpeg_source", {
              "is_local_file": True, "local_file": str(wav_path),
              "looping": True, "restart_on_activate": True,
              "close_when_inactive": False,
          }, True)
          time.sleep(1)
          assert wav_name in client.read_scene_inventory().input_names
          meters = client.read_actual_audio_meters(
              operator_approved=True, input_name=wav_name, duration=3)
          print("REAL_OBS_AUDIO_METER:",
                meters.selected_meter_events, meters.input_peaks,
                "selected_signal:", meters.selected_signal,
                "muted:", meters.selected_muted)
          assert meters.selected_signal and not meters.selected_muted, (
              "Official OBS media source did not produce live decoded PCM meter levels"
          )
          observation = client.inspect_program_media(
              operator_approved=True, input_name=wav_name, duration=3)
          print("REAL_OBS_AV_ROUTE:",
                observation.before_audio_route.origin,
                observation.before_audio_route.enabled_tracks,
                "coherent:", observation.coherent_media_candidate)
          assert observation.coherent_media_candidate, (
              "Official OBS real program-scene video + audio route not confirmed"
          )
          # Exercise the EXISTING operator-facing AISTING Tk controls against
          # the same real running OBS server. No fake UI, fake OBS or login.
          from tkinter import ttk
          from ai_broadcaster.desktop import AistingApp
          os.environ["LOCALAPPDATA"] = str(
              Path(os.environ["RUNNER_TEMP"]) / "AISTING-real-OBS-GUI-only")
          app = None
          def controls(parent, klass, predicate):
              found = []
              def visit(item):
                  if isinstance(item, klass) and predicate(item):
                      found.append(item)
                  for child in item.winfo_children():
                      visit(child)
              visit(parent)
              return found
          try:
              app = AistingApp()
              app.withdraw()
              app.update_idletasks()
              openers = controls(app, ttk.Button, lambda button:
                  button.cget("text") == "3단계 · 실제 OBS 연결 확인 (송출 안 함)")
              assert len(openers) == 1, "Real AISTING OBS UI opener missing"
              openers[0].invoke()
              studio = app._original_studio
              panel = studio._obs_window
              assert panel is not None and panel.winfo_exists()
              password_fields = controls(panel, ttk.Entry, lambda field:
                  field.cget("show") == "*")
              assert len(password_fields) == 1, "OBS password input missing"
              password_fields[0].insert(0, password)
              reads = controls(panel, ttk.Button, lambda button:
                  button.cget("text") == "실제 OBS 상태 읽기")
              assert len(reads) == 1, "Real AISTING OBS read button missing"
              reads[0].invoke()
              deadline = time.monotonic() + 25
              while time.monotonic() < deadline:
                  app.update()
                  label = studio.obs_status.get()
                  if label.startswith("OBS ") or label.startswith("실제 OBS 연결 실패:"):
                      break
                  time.sleep(.12)
              assert label.startswith("OBS "), "AISTING GUI did not read real OBS: " + label
              assert "송출 중지" in label and state.scene in label
              print("REAL_AISTING_TK_OBS_BUTTON:", label.splitlines()[0])
              assert studio._obs_panel_status is not None
              assert studio._obs_panel_status.get() == label
          finally:
              if app is not None:
                  app.destroy()
          assert not client.status().streaming
          '@ | Set-Content -Path $probe -Encoding utf8
            python $probe
            if ($LASTEXITCODE -ne 0) {
              $runner.Refresh()
              Write-Host "OBS_PROCESS_EXITED=$($runner.HasExited)"
              if ($runner.HasExited) { Write-Host "OBS_EXIT_CODE=$($runner.ExitCode)" }
              $logFolder = Join-Path $env:APPDATA 'obs-studio\logs'
              Write-Host "OBS_LOG_FOLDER_PRESENT=$(Test-Path $logFolder)"
              if (Test-Path $logFolder) {
                Get-ChildItem -Path $logFolder -File | Sort-Object LastWriteTime -Descending |
                  Select-Object -First 2 | ForEach-Object {
                    Write-Host "OFFICIAL_OBS_LOG=$($_.Name)"
                    Get-Content $_.FullName -Tail 110 | ForEach-Object {
                      $_.Replace($env:AISTING_CI_OBS_PASSWORD, '<REDACTED>')
                    }
                  }
              }
              throw 'Read-only real OBS integration failed; OBS process and logs recorded above'
            }
          } finally {
            if (-not $runner.HasExited) { Stop-Process -Id $runner.Id -Force -ErrorAction SilentlyContinue }
            Remove-Item Env:AISTING_CI_OBS_PASSWORD -ErrorAction SilentlyContinue
          }


  # Public third-party Twitch IRC ingress, not a mock, not a login, not a chat post.
  # One explicit short read of the public 'twitch' channel on a throwaway Windows VM.
  twitch-public-readonly:
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: src
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install existing WebSocket transport on disposable Windows runner
        shell: pwsh
        run: |
          python -m pip install "websocket-client==1.9.2"
          if ($LASTEXITCODE -ne 0) { throw 'Real websocket-client unavailable' }
      - name: Read public Twitch IRC JOIN and any actual live chat without sending
        shell: pwsh
        timeout-minutes: 2
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'aisting_twitch_public_read.py'
          @'
          from ai_broadcaster.twitch_readonly import TwitchReadOnlySession
          count = 0
          # High-traffic public channels, not the user's account. No writes to
          # chat; never publish message text or viewer identifiers to CI logs.
          for channel in ("ow_esports", "xqc", "valorant"):
              events = []
              session = TwitchReadOnlySession(
                  channel, lambda kind, item: events.append((kind, item)))
              session.run(max_seconds=14)
              ready = [item for kind, item in events if kind == "ready"]
              chat = [item for kind, item in events if kind == "chat"]
              print("REAL_TWITCH_PUBLIC_JOIN:", channel, bool(ready))
              print("REAL_TWITCH_PUBLIC_CHAT_COUNT:", channel, len(chat))
              assert ready, "Public Twitch IRC channel was not actually joined"
              count += len(chat)
              if count:
                  break
          assert count > 0, "No actual viewer chat read; do not claim live message delivery"
          '@ | Set-Content -Path $probe -Encoding utf8
          python $probe
          if ($LASTEXITCODE -ne 0) { throw 'Real public Twitch IRC read failed' }


  # Actual official Ollama CPU inference + original operator-facing Tk GUI.
  # Only on the disposable Windows CI machine; never modify the user's PC.
  ollama-real-local-e2e:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      PYTHONUTF8: '1'
      OLLAMA_NUM_GPU: '0'
      OLLAMA_HOST: '127.0.0.1:11434'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Download verified official portable Ollama into throwaway CI folder
        shell: pwsh
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'ollama-windows-amd64.zip'
          $url = 'https://github.com/ollama/ollama/releases/download/v0.20.2/ollama-windows-amd64.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip -MaximumRedirection 5
          $actual = (Get-FileHash -Path $zip -Algorithm SHA256).Hash
          $expected = 'F26EAD8BAA55E919828FFE88CDDF3E588444891E43E19A059F1D6C933FB1A5B6'
          if ($actual -ne $expected) { throw 'Official Ollama binary SHA256 mismatch' }
          $folder = Join-Path $env:RUNNER_TEMP 'ollama-portable'
          Expand-Archive -Path $zip -DestinationPath $folder -Force
          if (-not (Test-Path (Join-Path $folder 'ollama.exe'))) {
            throw 'Official portable Ollama CLI missing'
          }
          Write-Host 'Official CPU-only Ollama portable SHA256 verified on isolated CI'
      - name: Actually infer Korean using real Ollama and existing AISTING Tk buttons
        shell: pwsh
        timeout-minutes: 18
        run: |
          $ErrorActionPreference = 'Stop'
          $cli = Join-Path $env:RUNNER_TEMP 'ollama-portable\ollama.exe'
          $env:OLLAMA_MODELS = Join-Path $env:RUNNER_TEMP 'ollama-models'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'AISTING-real-local-AI'
          New-Item -ItemType Directory -Path $env:LOCALAPPDATA -Force | Out-Null
          python -m pip install "websocket-client==1.9.0"
          if ($LASTEXITCODE -ne 0) { throw 'Real Twitch WebSocket dependency unavailable' }
          $server = Start-Process -FilePath $cli -ArgumentList 'serve' -PassThru -WindowStyle Hidden
          try {
            $healthy = $false
            for ($i=0; $i -lt 45; $i++) {
              try {
                $probe = Invoke-RestMethod -Uri 'http://127.0.0.1:11434/api/tags' -TimeoutSec 2
                $healthy = $true
                break
              } catch {
                Start-Sleep -Seconds 2
              }
            }
            if (-not $healthy) { throw 'Real local Ollama server did not become healthy' }
            & $cli pull qwen2.5:0.5b
            if ($LASTEXITCODE -ne 0) { throw 'Actual free 0.5B Ollama model pull failed' }
            $script = Join-Path $env:RUNNER_TEMP 'aisting_real_ollama_gui.py'
            @'
          import queue
          import time
          from tkinter import ttk
          from ai_broadcaster.desktop import AistingApp
          from ai_broadcaster.offline_settings import load_settings
          from ai_broadcaster.twitch_readonly import TwitchChatLine, TwitchReadOnlySession
          from ai_broadcaster.desktop_chat_tab import LocalChatTab

          def find_button(node, name):
              found = []
              def scan(widget):
                  if isinstance(widget, ttk.Button) and widget.cget("text") == name:
                      found.append(widget)
                  for child in widget.winfo_children():
                      scan(child)
              scan(node)
              assert len(found) == 1, (name, len(found))
              return found[0]

          app = None
          try:
              app = AistingApp()
              app.withdraw()
              find_button(app, "내 캐릭터").invoke()
              app._persona_mode.set("직접 만들기")
              expected = {"name": "CI한국어방송인", "style": "간결하고 명확한 한국어",
                          "character": "친절한 가상 방송 진행자"}
              for key, value in expected.items():
                  widget = app._persona[key]
                  widget.delete(0, "end")
                  widget.insert(0, value)
              find_button(app, "캐릭터 확정·저장").invoke()
              assert load_settings()["persona"] == expected
              find_button(app, "실제 채팅·AI").invoke()
              tab = app._real_chat_tab
              assert isinstance(tab, LocalChatTab) and tab.winfo_exists()
              tab._model_name.set("qwen2.5:0.5b")
              tab._input.set("안녕. 한국어로 한 문장만 인사해 줘.")
              find_button(tab, "텍스트 전송").invoke()
              deadline = time.monotonic() + 155
              while time.monotonic() < deadline and tab._last_reply is None:
                  app.update()
                  time.sleep(.15)
              assert tab._last_reply and tab._last_reply.strip(), (
                  "Existing AISTING Tk button did not obtain a real Ollama reply"
              )
              assert "AI:" in tab._dialog.get("1.0", "end"), (
                  "Real Ollama reply was not rendered in AISTING chat window"
              )
              print("REAL_OLLAMA_TK_KOREAN_REPLY_CHARS:", len(tab._last_reply))
              # Run the live-viewer FIFO through the same REAL Ollama instance.
              # This particular chat is a CI test fixture; the separate Twitch
              # job proves actual public internet chat arrivals.
              tab._last_reply = None
              inbox = queue.SimpleQueue()
              inbox.put(TwitchChatLine("ciroom", "testviewer", "안녕하세요, AI"))
              inbox.put(None)
              import threading
              worker = threading.Thread(target=tab._work_twitch_ai,
                                        args=("qwen2.5:0.5b", inbox), daemon=True)
              worker.start()
              deadline = time.monotonic() + 155
              while time.monotonic() < deadline and tab._twitch_replied < 1:
                  app.update()
                  time.sleep(.15)
              assert tab._twitch_replied == 1 and tab._twitch_ai_failures == 0, (
                  "Real model did not answer chat through AISTING viewer FIFO"
              )
              assert "AI → [트위치] testviewer:" in tab._dialog.get("1.0", "end")
              print("REAL_OLLAMA_VIEWER_FIFO_REPLIES:", tab._twitch_replied)

              # REAL network viewer message -> existing AISTING Tk results
              # queue -> real local Ollama model -> same GUI reply display.
              # No login, user identifiers in CI logs, platform chat posting,
              # OBS broadcast, TTS recording or voice cloning.
              observed = []
              reader = TwitchReadOnlySession(
                  "xqc", lambda kind, item: observed.append((kind, item)))
              reader.run(max_seconds=19)
              real_chats = [
                  item for kind, item in observed
                  if kind == "chat" and item.text.strip() and len(item.text) <= 4000
              ]
              assert any(kind == "ready" for kind, _ in observed), (
                  "Public Twitch server JOIN not confirmed")
              assert real_chats, (
                  "No real live viewer message arrived; cannot claim a real chat-to-AI integration")
              tab._twitch_received = 0
              tab._twitch_replied = 0
              tab._twitch_ai_failures = 0
              tab._twitch_ai_inbox = queue.SimpleQueue()
              worker = threading.Thread(
                  target=tab._work_twitch_ai,
                  args=("qwen2.5:0.5b", tab._twitch_ai_inbox), daemon=True)
              worker.start()
              # Pass the actual parsed viewer event through the REAL Tk
              # results event handler, rather than directly invoking a model.
              tab._results.put(("twitch_chat", real_chats[0]))
              deadline = time.monotonic() + 155
              while time.monotonic() < deadline and (
                  tab._twitch_replied + tab._twitch_ai_failures < 1):
                  app.update()
                  time.sleep(.15)
              assert tab._twitch_received == 1, "Real viewer was not shown in the existing GUI"
              assert tab._twitch_replied == 1 and tab._twitch_ai_failures == 0, (
                  "Real viewer chat did not produce an actual local AI reply")
              assert "AI → [트위치]" in tab._dialog.get("1.0", "end")
              tab._twitch_ai_inbox.put(None)
              tab._twitch_ai_inbox = None
              print("REAL_TWITCH_TO_OLLAMA_GUI_E2E:", tab._twitch_received,
                    tab._twitch_replied)
              assert not app.settings["streaming_enabled"]
          finally:
              if app is not None:
                  app.destroy()
          '@ | Set-Content -Path $script -Encoding utf8
            python $script
            if ($LASTEXITCODE -ne 0) { throw 'Real AISTING GUI + local Ollama inference failed' }
          } finally {
            if (-not $server.HasExited) {
              Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
            }
          }


  korean-public-chat-readonly:
    runs-on: windows-latest
    timeout-minutes: 15
    continue-on-error: true
    env:
      PYTHONPATH: src
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install transport for actual Korean read-only chat
        shell: pwsh
        run: |
          python -m pip install "websocket-client==1.9.0"
      - name: Probe real public CHZZK and SOOP live rooms (no chat posting)
        shell: pwsh
        timeout-minutes: 5
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'aisting_public_kr_platforms.py'
          @'
          import json
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          from ai_broadcaster.multiplatform_readonly import (
              ChzzkReadOnlySession, SoopReadOnlySession, _json_get)
          received = {"chzzk": 0, "soop": 0}
          try:
              result = _json_get("https://api.chzzk.naver.com/service/v1/lives?size=24")
              rows = (result.get("content") or {}).get("data") or []
              for row in rows[:3]:
                  cid = str((row.get("channel") or {}).get("channelId") or "")
                  if len(cid) != 32:
                      continue
                  events = []
                  try:
                      ChzzkReadOnlySession(
                          cid, lambda k, v: events.append((k, v))
                      ).run(max_seconds=10)
                  except Exception as error:
                      print("REAL_CHZZK_ERROR_TYPE:", type(error).__name__)
                      continue
                  print("REAL_CHZZK_CONNECTED:", any(k=="ready" for k,_ in events))
                  received["chzzk"] += sum(k=="chat" for k,_ in events)
                  if received["chzzk"]:
                      break
          except Exception as error:
              print("REAL_CHZZK_DISCOVERY_ERROR:", type(error).__name__)
          try:
              req = Request("https://api.m.sooplive.co.kr/broad/a/items2",
                  data=urlencode({"theme_id":"all","group_id":"",
                     "category_no":"","current_page":"1"}).encode(),
                  headers={"Content-Type":"application/x-www-form-urlencoded"})
              with urlopen(req,timeout=12) as response:
                  listing=json.loads(response.read(1000000))
              groups=(listing.get("data") or {}).get("groups") or []
              rows=groups[0].get("contents",[]) if groups else []
              for row in rows[:3]:
                  channel=str(row.get("user_id") or "")+"/"+str(row.get("broad_no") or "")
                  events=[]
                  try:
                      SoopReadOnlySession(channel,
                          lambda k,v: events.append((k,v))).run(max_seconds=10)
                  except Exception as error:
                      print("REAL_SOOP_ERROR_TYPE:",type(error).__name__)
                      continue
                  received["soop"] += sum(k=="chat" for k,_ in events)
                  if received["soop"]:
                      break
          except Exception as error:
              print("REAL_SOOP_DISCOVERY_ERROR:",type(error).__name__)
          print("REAL_KOREAN_CHAT_COUNTS:",json.dumps(received,sort_keys=True))
          assert received["chzzk"]>0 and received["soop"]>0, (
              "Actual CHZZK and SOOP live chat events not both received")
          '@ | Set-Content -Path $probe -Encoding utf8
          python $probe
          if ($LASTEXITCODE -ne 0) { throw 'Public Korean live chat was not fully verified' }
