name: AISTING existing Windows EXE build

# Build the already integrated original application, never the obsolete
# scripts/desktop_app.py entrypoint. No push, merge or installation on user PC.
on:
  workflow_dispatch:
  push:
    branches:
      - dev/aisting-local-source-v26-20261016

permissions:
  contents: read

concurrency:
  group: aisting-existing-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
      PYTHONPATH: src
      AISTING_PYTHON: python
    steps:
      - name: Checkout complete existing AISTING source
        uses: actions/checkout@v4

      - name: Set up Windows Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64

      - name: Install free build dependencies on disposable Windows runner
        shell: pwsh
        run: |
          python -m pip install "pyinstaller>=6,<7" "pywebview>=5,<7" "obsws-python==1.8.0"
          python -c "import tkinter, PyInstaller, webview, obsws_python; print('Windows build dependencies present')"

      - name: Validate original 100-step specification and project
        shell: pwsh
        run: |
          python tools.py validate

      - name: Verify integrated native Windows entrypoint and viewer
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_aisting*.py" -v

      - name: Audit full original regression suite (track known legacy incompatibilities)
        id: inherited
        shell: pwsh
        continue-on-error: true
        run: |
          python -m unittest discover -s tests -v

      - name: Build real native Windows executable and run its self-test
        shell: cmd
        run: call build_exe_windows.bat

      - name: Verify one nonempty bundled executable
        shell: pwsh
        run: |
          $executables = @(Get-ChildItem -Path . -Recurse -File -Filter AISTING.exe |
            Where-Object { $_.Directory.Name -like 'dist-native-*' })
          if ($executables.Count -ne 1) { throw "Expected exactly one built AISTING.exe; found $($executables.Count)" }
          if ($executables[0].Length -lt 1000000) { throw "AISTING.exe unexpectedly small" }
          Write-Host "Windows AISTING.exe built: $($executables[0].FullName) ($($executables[0].Length) bytes)"

      - name: Construct original Windows Tk GUI inside isolated CI and close it
        shell: pwsh
        timeout-minutes: 4
        env:
          AISTING_GUI_SELFTEST: approved_ci_only
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'AISTING-EXE-GUI-TEST'
          New-Item -ItemType Directory -Path $env:LOCALAPPDATA -Force | Out-Null
          $exe = @(Get-ChildItem -Path . -Recurse -File -Filter AISTING.exe |
            Where-Object { $_.Directory.Name -like 'dist-native-*' })
          if ($exe.Count -ne 1) { throw 'No unique Windows native executable to test' }
          $process = Start-Process -FilePath $exe[0].FullName -ArgumentList '--aisting-gui-selftest' -PassThru
          try {
            if (-not $process.WaitForExit(90000)) {
              throw 'Original AISTING Windows Tk GUI did not exit within 90 seconds'
            }
            $process.Refresh()
            if ($process.ExitCode -ne 0) {
              throw "Original AISTING Windows Tk GUI startup failed (exit $($process.ExitCode))"
            }
            Write-Host 'Original AISTING Tk GUI created and destroyed successfully in isolated CI'
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Upload real Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: AISTING-Windows-EXE-integrated
          path: dist-native-*/AISTING.exe
          if-no-files-found: error
          retention-days: 30

      - name: Report unresolved original regression failures as CI failure
        if: steps.inherited.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Error "Full inherited regression suite has failures. EXE artifact is a build candidate, not a fully validated program."
          exit 1


  # Real OBS Studio, not a mocked obsws response. Runs in a disposable Windows VM.
  # Does not connect to the user's device, access accounts, start recording or stream.
  obs-real-readonly:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: src
      PYTHONUTF8: '1'
    steps:
      - name: Checkout same existing AISTING development source
        uses: actions/checkout@v4

      - name: Set up Windows Python and actual OBS websocket client
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install original official OBS Studio only on disposable CI VM
        shell: pwsh
        run: |
          choco install obs-studio --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { throw 'OBS Studio installation failed on the temporary CI machine' }

      - name: Connect to running official OBS v5 and read actual scene / frame
        shell: pwsh
        timeout-minutes: 5
        run: |
          python -m pip install "obsws-python==1.8.0"
          if ($LASTEXITCODE -ne 0) { throw 'Existing OBS SDK installation failed' }
          $obs = Join-Path $env:ProgramFiles 'obs-studio\bin\64bit\obs64.exe'
          if (-not (Test-Path $obs)) { throw "Official OBS binary not found at $obs" }
          $env:AISTING_CI_OBS_PASSWORD = [guid]::NewGuid().ToString('N')
          # A fresh OBS user profile has its WebSocket server DISABLED by
          # default. OBS v5 stores this in plugin_config/obs-websocket/config.json.
          # Enable ONLY the isolated CI profile; CLI supplies a throwaway password.
          $confDir = Join-Path $env:APPDATA 'obs-studio\plugin_config\obs-websocket'
          New-Item -ItemType Directory -Path $confDir -Force | Out-Null
          $conf = '{"FirstLoad":false,"ServerEnabled":true,"AuthRequired":true,"ServerPort":4455}'
          Set-Content -Path (Join-Path $confDir 'config.json') -Value $conf -Encoding utf8
          # The official OBS first-run wizard can block completion of module
          # initialization on unattended Windows CI. Only this throwaway
          # runner profile is marked as initialized; no real profile touched.
          $obsUser = Join-Path $env:APPDATA 'obs-studio'
          # Retain OBS-generated user.ini; only seed disposable global.ini and plugin configuration.
          # Also support upstream's global.ini -> plugin JSON migration path.
          @('[General]', 'LastVersion=320202', '[OBSWebSocket]',
            'FirstLoad=false', 'ServerEnabled=true', 'AuthRequired=true',
            'ServerPort=4455') | Set-Content (Join-Path $obsUser 'global.ini') -Encoding ascii
          Write-Host 'Configured real OBS websocket and first-run state in isolated Windows CI profile'

          $runner = Start-Process -FilePath $obs -WorkingDirectory (Split-Path $obs -Parent) -ArgumentList @(
            '--disable-updater', '--disable-shutdown-check', '--websocket_ipv4_only',
            '--websocket_port=4455', "--websocket_password=$env:AISTING_CI_OBS_PASSWORD"
          ) -PassThru
          try {
            $probe = Join-Path $env:RUNNER_TEMP 'aisting_real_obs_probe.py'
            @'
          import os
          import time
          from ai_broadcaster.original_plan_obs import OfficialObsWebsocket
          password = os.environ["AISTING_CI_OBS_PASSWORD"]
          deadline = time.monotonic() + 90
          last_error = None
          while time.monotonic() < deadline:
              try:
                  client = OfficialObsWebsocket(password, port=4455)
                  state = client.connect()
                  break
              except Exception as error:
                  last_error = error
                  time.sleep(2)
          else:
              raise AssertionError("Official OBS WebSocket 5 did not start") from last_error
          print("REAL_OBS_CONNECTED:", state.version, state.scene, "streaming:", state.streaming)
          assert not state.streaming, "AISTING must never broadcast during CI"
          inventory = client.read_scene_inventory()
          print("REAL_OBS_SCENE_ITEMS:", inventory.scene_items)
          print("REAL_OBS_INPUTS:", inventory.input_names)
          frame = client.read_current_scene_frame(operator_approved=True)
          print("REAL_OBS_RENDERED_PNG:", frame.width, frame.height, len(frame.png_data))
          assert frame.png_data.startswith(b'\x89PNG\r\n\x1a\n')
          # Actual OBS rendered-video verification. Create a temporary
          # source ONLY in the CI runner's fresh default scene. Read both
          # frames through AISTING's existing real OBS PNG decoder.
          import hashlib
          import obsws_python
          active = obsws_python.ReqClient(host="127.0.0.1", port=4455,
                                          password=password, timeout=5)
          available = active.get_input_kind_list(False).input_kinds
          assert "color_source_v3" in available, "Official OBS color input unavailable"
          ci_input = "AISTING CI color input"
          active.create_input(state.scene, ci_input, "color_source_v3",
                              {"color": 0xFF0000FF, "width": 640, "height": 360}, True)
          assert ci_input in client.read_scene_inventory().input_names
          time.sleep(1)
          before = client.read_current_scene_frame(operator_approved=True)
          active.set_input_settings(ci_input, {"color": 0xFF00FF00}, True)
          time.sleep(1)
          after = client.read_current_scene_frame(operator_approved=True)
          assert before.width == after.width == 640
          assert before.height == after.height == 360
          assert before.png_data != after.png_data, (
              "Real OBS source changed but OBS-rendered pixels did not"
          )
          print("REAL_OBS_LIVE_VIDEO_CHANGE:",
                hashlib.sha256(before.png_data).hexdigest()[:16],
                hashlib.sha256(after.png_data).hexdigest()[:16])
          assert not client.status().streaming
          '@ | Set-Content -Path $probe -Encoding utf8
            python $probe
            if ($LASTEXITCODE -ne 0) {
              $runner.Refresh()
              Write-Host "OBS_PROCESS_EXITED=$($runner.HasExited)"
              if ($runner.HasExited) { Write-Host "OBS_EXIT_CODE=$($runner.ExitCode)" }
              $logFolder = Join-Path $env:APPDATA 'obs-studio\logs'
              Write-Host "OBS_LOG_FOLDER_PRESENT=$(Test-Path $logFolder)"
              if (Test-Path $logFolder) {
                Get-ChildItem -Path $logFolder -File | Sort-Object LastWriteTime -Descending |
                  Select-Object -First 2 | ForEach-Object {
                    Write-Host "OFFICIAL_OBS_LOG=$($_.Name)"
                    Get-Content $_.FullName -Tail 110 | ForEach-Object {
                      $_.Replace($env:AISTING_CI_OBS_PASSWORD, '<REDACTED>')
                    }
                  }
              }
              throw 'Read-only real OBS integration failed; OBS process and logs recorded above'
            }
          } finally {
            if (-not $runner.HasExited) { Stop-Process -Id $runner.Id -Force -ErrorAction SilentlyContinue }
            Remove-Item Env:AISTING_CI_OBS_PASSWORD -ErrorAction SilentlyContinue
          }
